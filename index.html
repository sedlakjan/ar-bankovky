<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>AR Bankovky – callouty</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }

  body { min-height: 100vh; height: 100dvh; }

  video {
    position: fixed !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    object-position: center center !important;
    z-index: 0 !important;
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
    background: black !important;
  }

  a-scene {
    position: fixed !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    z-index: 1 !important;
  }

  canvas.a-canvas {
    position: fixed !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    z-index: 1 !important;
    background: transparent !important;
    pointer-events: none !important;
  }

  .mindar-ui-overlay {
    position: fixed !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    z-index: -1 !important;
    background: transparent !important;
    pointer-events: none !important;
  }



  .hint {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: max(10px, env(safe-area-inset-top));
    z-index: 60;
    max-width: min(92%, 760px);
    padding: 12px 16px;
    border-radius: 999px;
    color: #fff;
    font-size: 14px;
    line-height: 1.2;
    text-align: center;
    background: rgba(10,18,32,.58);
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 28px rgba(0,0,0,.28);
    pointer-events: none;
    white-space: nowrap;
  }
#app {
  position: fixed;
  inset: 0;
  z-index: 20;
  pointer-events: none;
}

#calloutsLayer {
  position: fixed;
  inset: 0;
  z-index: 50;
  pointer-events: auto;
}


.callout {
  --accent: #ffffff;
  position: absolute;
  left: 0;
  top: 0;
  width: 0;
  height: 0;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .22s ease, transform .22s ease;
    pointer-events: none;
}


.calloutDot,
.calloutLine {
  pointer-events: none;
}

.calloutCard,
.calloutMore {
  pointer-events: auto;
}
.callout.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.calloutDot {
  position: absolute;
  width: 16px;
  height: 16px;
  left: 0;
  top: 0;
  transform: translate(-50%, -50%);
  border-radius: 999px;
  background: var(--accent);
  box-shadow:
    0 0 0 7px color-mix(in srgb, var(--accent) 18%, transparent),
    0 8px 24px rgba(0,0,0,.35);
}

.calloutDot::after {
  content: "";
  position: absolute;
  inset: -8px;
  border-radius: inherit;
  border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
  opacity: .8;
  animation: pulseDot 1.8s ease-out infinite;
}

@keyframes pulseDot {
  0%   { transform: scale(.7); opacity: .65; }
  70%  { transform: scale(1.35); opacity: 0; }
  100% { transform: scale(1.35); opacity: 0; }
}

.calloutLine {
  position: absolute;
  left: 0;
  top: 0;
  height: 2px;
  width: var(--line-length, 120px);
  background: linear-gradient(90deg, var(--accent), rgba(255,255,255,.95));
  transform-origin: left center;
  transform: rotate(var(--line-angle, 0deg)) scaleX(0);
  box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 35%, transparent);
  transition: transform .28s ease .08s;
}

.callout.is-visible .calloutLine {
  transform: rotate(var(--line-angle, 0deg)) scaleX(1);
}

.calloutCard {
  position: fixed;
  width: min(250px, calc(100vw - 24px));
  pointer-events: auto;
  border-radius: 18px;
  padding: 12px 12px 34px;
  background: linear-gradient(180deg, rgba(15,23,42,.86), rgba(5,8,16,.82));
  border: 1px solid rgba(255,255,255,.14);
  border-left: 4px solid var(--accent);
  backdrop-filter: blur(14px);
  box-shadow: 0 18px 45px rgba(0,0,0,.34);
  opacity: 0;
  transform: translateY(8px) scale(.98);
  transition: opacity .24s ease .18s, transform .24s ease .18s;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}

.callout.is-visible .calloutCard {
  opacity: 1;
  transform: translateY(0) scale(1);
}
.calloutCard:active {
  transform: translateY(1px) scale(.985);
}
.calloutHead {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}
.calloutTapIcon {
  position: absolute;
  right: 10px;
  bottom: 10px;
  width: 22px;
  height: 22px;
  object-fit: contain;
  opacity: .92;
  pointer-events: none;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,.35));
}
.calloutCard.is-toggle .calloutTapIcon {
  opacity: .82;
}
.calloutBadge {
  display: inline-grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--accent) 20%, rgba(255,255,255,.08));
  border: 1px solid color-mix(in srgb, var(--accent) 45%, rgba(255,255,255,.14));
  color: var(--accent);
  font-weight: 900;
  font-size: 13px;
  flex: 0 0 auto;
}

.calloutTitle {
  font-weight: 800;
  font-size: 15px;
  line-height: 1.18;
  color: #fff;
}

.calloutText {
  font-size: 13px;
  line-height: 1.34;
  color: rgba(255,255,255,.95);
}

.calloutActions {
  display: flex;
  justify-content: flex-start;
  margin-top: 10px;
}

.calloutMore {
  appearance: none;
  border: 1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.08);
  color: #fff;
  border-radius: 999px;
  padding: 7px 10px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}

#modalOverlay {
  position: fixed;
  inset: 0;
  background: rgba(5,10,20,.66);
  backdrop-filter: blur(6px);
  z-index: 110;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease;
}

#modal {
  position: fixed;
  inset: 0;
  z-index: 120;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  pointer-events: none;
  opacity: 0;
  transition: opacity .22s ease;
}

#modalCard {
  width: min(94vw, 720px);
  max-height: min(88vh, 860px);
  overflow: auto;
  border-radius: 22px;
  border: 1px solid rgba(255,255,255,.14);
  background: linear-gradient(180deg, rgba(15,23,42,.96), rgba(5,8,16,.94));
  padding: 20px;
  color: #fff;
  box-shadow: 0 26px 80px rgba(0,0,0,.48);
  transform: scale(.96);
  opacity: 0;
  transition: transform .22s ease, opacity .22s ease;
  pointer-events: auto;
  -webkit-overflow-scrolling: touch;
}

#modalHead {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

#modalTitle {
  font-weight: 900;
  font-size: 20px;
  line-height: 1.15;
}

#modalClose {
  background: rgba(255,255,255,.09);
  border: 1px solid rgba(255,255,255,.14);
  color: #fff;
  border-radius: 12px;
  padding: 8px 12px;
  cursor: pointer;
  user-select: none;
  flex: 0 0 auto;
}

#modalMedia:empty { display: none; }

#modalMedia img {
  width: 100%;
  display: block;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.04);
  max-height: 42vh;
  object-fit: contain;
}

#modalText {
  margin-top: 14px;
  font-size: 15px;
  line-height: 1.48;
  color: rgba(255,255,255,.96);
}

body.modal-open #modalOverlay {
  opacity: 1;
  pointer-events: auto;
}

body.modal-open #modal {
  opacity: 1;
  pointer-events: auto;
}

body.modal-open #modalCard {
  transform: scale(1);
  opacity: 1;
}

body.modal-open #calloutsLayer {
  pointer-events: none;
}

body.modal-open .callout {
  opacity: 0;
  pointer-events: none;
}
  .bottomHint {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(14px + env(safe-area-inset-bottom));
    z-index: 60;
    max-width: min(92%, 820px);
    padding: 10px 14px;
    border-radius: 999px;
    color: rgba(255,255,255,.95);
    font-size: 13px;
    line-height: 1.2;
    text-align: center;
    background: rgba(10,18,32,.52);
    border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 28px rgba(0,0,0,.22);
    pointer-events: none;
    white-space: nowrap;
  }

  #scan {
    position: absolute;
    inset: 0;
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    pointer-events: none;
  }

  .reticleWrap {
    display: grid;
    place-items: center;
    width: min(70%, 420px);
    aspect-ratio: 1.9 / 1;
  }

  .reticle { position: relative; width: 100%; height: 100%; }

  .reticleCorner {
    position: absolute;
    width: 42px;
    height: 42px;
    border-color: rgba(255,255,255,.92);
    border-style: solid;
    filter: drop-shadow(0 0 12px rgba(255,255,255,.14));
  }
  .reticleCorner.tl { top:0;left:0;border-width:3px 0 0 3px;border-top-left-radius:18px; }
  .reticleCorner.tr { top:0;right:0;border-width:3px 3px 0 0;border-top-right-radius:18px; }
  .reticleCorner.bl { bottom:0;left:0;border-width:0 0 3px 3px;border-bottom-left-radius:18px; }
  .reticleCorner.br { bottom:0;right:0;border-width:0 3px 3px 0;border-bottom-right-radius:18px; }

  .reticleCenter {
    position: absolute;
    left: 50%; top: 50%;
    width: 72px; height: 72px;
    transform: translate(-50%, -50%);
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.18);
    background:
      radial-gradient(circle at center, rgba(255,255,255,.22) 0 2px, transparent 3px),
      linear-gradient(rgba(255,255,255,.7), rgba(255,255,255,.7)),
      linear-gradient(90deg, rgba(255,255,255,.7), rgba(255,255,255,.7));
    background-size: 4px 4px, 1px 32px, 32px 1px;
    background-repeat: no-repeat;
    background-position: center, center, center;
    animation: pulseAim 1.8s ease-in-out infinite;
  }

  @keyframes pulseAim {
    0%,100% { transform: translate(-50%,-50%) scale(1); opacity:.72; }
    50% { transform: translate(-50%,-50%) scale(1.04); opacity:1; }
  }

  .scanText {
    color: rgba(255,255,255,.96);
    font-size: 15px;
    font-weight: 600;
    background: rgba(10,18,32,.50);
    border: 1px solid rgba(255,255,255,.12);
    padding: 10px 14px;
    border-radius: 999px;
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 28px rgba(0,0,0,.22);
  }




  body.is-rotated-ui .card {
    min-width: min(240px, 55%);
    max-width: min(310px, 62%);
  }



  .card:hover .cardInner {
    transform: translateY(-2px);
    box-shadow: 0 22px 50px rgba(0,0,0,.4);
  }

  .card.ar-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .card.card-enter { animation: cardGrow .24s ease both; }

  @keyframes cardGrow {
    from { opacity: 0; transform: scale(.96); }
    to   { opacity: 1; transform: scale(1); }
  }

  .card .headRow { display:flex; align-items:center; gap:10px; margin-bottom:6px; }

  .card .badge {
    display: inline-grid;
    place-items: center;
    width: 28px; height: 28px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 18%, rgba(255,255,255,.08));
    border: 1px solid color-mix(in srgb, var(--accent) 45%, rgba(255,255,255,.18));
    color: var(--accent);
    font-weight: 900;
    flex: 0 0 auto;
  }

  .card .title { font-weight:800; font-size:17px; line-height:1.2; }
  .card .body  { font-size:15px; opacity:.96; }

  .card .small {
    margin-top: 10px;
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    color: rgba(255,255,255,.92);
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    padding: 7px 10px;
    border-radius: 999px;
  }





  .dot.isDot {
    width: 16px;
    height: 16px;
    border-radius: 999px;
    background: var(--accent);
    box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 18%, transparent), 0 8px 24px rgba(0,0,0,.35);
  }

  .dot.isIcon svg {
    width:24px;
    height:24px;
    fill:var(--accent);
    stroke:var(--accent);
    filter:drop-shadow(0 0 10px rgba(255,255,255,.28));
  }

  .iconDot { width:18px; height:18px; display:grid; place-items:center; }
  .dot svg  { width:18px; height:18px; fill:var(--accent); stroke:var(--accent); }



  body.is-rotated-ui #modal {
    padding: 0;
  }

  body.is-rotated-ui #modalCard {

  #modalTitle {

  }

  #modalImg {
    width: 100%;

    display: block;
    max-height: 40vh;

  }

  body.is-rotated-ui #modalImg { max-height: 36vw; }

  #modalText {
    margin-top: 12px;
    font-size: 15px;
    line-height: 1.45;
    opacity: .96;
  }

  .slider { position: relative; margin-top: 4px; }

  .sliderStage {
    position: relative;
    overflow: hidden;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.04);
  }

  .sliderTrack {
    display: flex;
    transition: transform .35s ease;
    will-change: transform;
  }

  .slide { min-width: 100%; flex: 0 0 100%; }
  .slide img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 38vh;
    object-fit: contain;
  }

  body.is-rotated-ui .slide img { max-height: 32vw; }

  .sliderNav {
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .sliderBtn {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.14);
    color: #fff;
    border-radius: 12px;
    padding: 8px 12px;
    cursor: pointer;
    pointer-events: auto;
  }

  .sliderDots {
    display:flex;
    gap:6px;
    align-items:center;
    justify-content:center;
    flex:1;
  }

  .sliderDots button {
    width: 10px;
    height: 10px;
    border-radius: 999px;
    border: 0;
    background: rgba(255,255,255,.24);
    cursor: pointer;
    padding: 0;
    pointer-events: auto;
  }

  .sliderDots button.active { background: #fff; }
  .callout {

}

}

}

}

.calloutLine {
  display: none;
}
</style>

const SMOOTH = 0.35;
const dotState = new WeakMap();

let activeAnchorId = null;
let renderedTargetId = null;
let running = false;
let modalOpen = false;
let currentCalloutNodes = [];
let lastVisibleTargetId = null;

const hintEl = document.getElementById("hint");
const bottomHintEl = document.getElementById("bottomHint");
const scanEl = document.getElementById("scan");
const calloutsLayer = document.getElementById("calloutsLayer");
const modal = document.getElementById("modal");
const modalOverlay = document.getElementById("modalOverlay");
const modalCard = document.getElementById("modalCard");
const modalTitle = document.getElementById("modalTitle");
const modalMedia = document.getElementById("modalMedia");
const modalText = document.getElementById("modalText");
const modalClose = document.getElementById("modalClose");
const sceneEl = document.querySelector("a-scene");
if (!sceneEl) {
  console.error("a-scene sa nenašla v HTML");
}
const anchors = ["a0", "a1", "a2", "a3", "a4", "a5"].map(id => document.getElementById(id));

(function patchGetUserMediaForFirefox() {
  const isFF = navigator.userAgent.toLowerCase().includes("firefox");
  if (!isFF || !navigator.mediaDevices?.getUserMedia) return;

  const orig = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);

  navigator.mediaDevices.getUserMedia = async function (constraints) {
    let c = constraints;

    if (c?.video && typeof c.video === "object") {
      const v = { ...c.video };

      if (v.facingMode && typeof v.facingMode === "object" && v.facingMode.exact) {
        v.facingMode = { ideal: v.facingMode.exact };
      }

      delete v.width;
      delete v.height;
      delete v.aspectRatio;

      c = { ...c, video: v };
    }

    try {
      return await orig(c);
    } catch (err) {
      console.warn("Firefox primary gUM failed, retrying relaxed constraints", err);
      return orig({
        audio: false,
        video: { facingMode: { ideal: "environment" } }
      });
    }
  };
})();

function styleMindarVideo() {
  const videos = [...document.querySelectorAll("video")];
  const v = videos.find(el =>
    el.autoplay ||
    el.getAttribute("autoplay") !== null ||
    el.playsInline ||
    el.getAttribute("playsinline") !== null
  );

  if (!v) return false;

  v.setAttribute("autoplay", "");
  v.setAttribute("muted", "");
  v.setAttribute("playsinline", "");
  v.muted = true;
  v.playsInline = true;
  v.autoplay = true;

  Object.assign(v.style, {
    position: "fixed",
    inset: "0",
    width: "100%",
    height: "100%",
    objectFit: "cover",
    objectPosition: "center center",
    zIndex: "0",
    display: "block",
    visibility: "visible",
    opacity: "1",
    background: "black"
  });

  const p = v.play && v.play();
  if (p && typeof p.catch === "function") {
    p.catch(err => console.warn("video.play() failed", err));
  }

  return true;
}

function ensureMindarVideo(retries = 24) {
  let n = 0;
  const timer = setInterval(() => {
    n++;
    const ok = styleMindarVideo();
    if (ok || n >= retries) clearInterval(timer);
  }, 250);
}

function isLandscapeLike() {
  return window.innerWidth > window.innerHeight;
}

function clearCallouts() {
  currentCalloutNodes = [];
  calloutsLayer.innerHTML = "";
}

function showScanState() {
  running = false;
  scanEl.style.display = "flex";
  clearCallouts();

  bottomHintEl.textContent = lastVisibleTargetId
    ? `Bankovka sa stratila z dohľadu. ${TARGETS[lastVisibleTargetId]?.bottomHint || ""}`
    : "Tip: drž bankovku rovno a v dobrom svetle";
}

function showARState() {
  scanEl.style.display = "none";
  running = true;
}

function placeDotProjected(dotEl, anchorEl, local) {
  const cam = sceneEl?.camera;
  if (!cam || !anchorEl?.object3D) return null;

  anchorEl.object3D.updateMatrixWorld(true);

  const v = new THREE.Vector3(local.x, local.y, local.z ?? 0.01);
  v.applyMatrix4(anchorEl.object3D.matrixWorld);
  v.project(cam);

  if (v.z < -1 || v.z > 1) {
    dotEl.style.display = "none";
    return null;
  }

  const tx = (v.x * 0.5 + 0.5) * window.innerWidth;
  const ty = (-v.y * 0.5 + 0.5) * window.innerHeight;

  let s = dotState.get(dotEl);
  if (!s) {
    s = { x: tx, y: ty };
    dotState.set(dotEl, s);
  }

  s.x += (tx - s.x) * SMOOTH;
  s.y += (ty - s.y) * SMOOTH;

  dotEl.style.display = "block";
  dotEl.style.left = "0px";
  dotEl.style.top = "0px";

  return { x: s.x, y: s.y };
}

function applyCardPosition(node, callout, index = 0) {
  const card = node.querySelector(".calloutCard");
  if (!card) return;

  const pos = isLandscapeLike() && callout.cardPosLandscape
    ? callout.cardPosLandscape
    : callout.cardPos;

  if (!pos) return;

  card.style.left = "";
  card.style.right = "";
  card.style.top = "";
  card.style.bottom = "";
  card.style.transform = "";
  card.style.width = "";
  card.style.position = "fixed";

  if (pos.top != null) card.style.top = pos.top;
  if (pos.left != null) card.style.left = pos.left;
  if (pos.right != null) card.style.right = pos.right;
  if (pos.bottom != null) card.style.bottom = pos.bottom;

  requestAnimationFrame(() => {
    const rect = card.getBoundingClientRect();
    const margin = 12;

    let left = rect.left;
    let top = rect.top;

    if (rect.right > window.innerWidth - margin) {
      left -= rect.right - (window.innerWidth - margin);
      card.style.left = `${Math.max(margin, left)}px`;
      card.style.right = "auto";
    }

    if (rect.left < margin) {
      card.style.left = `${margin}px`;
      card.style.right = "auto";
    }

    if (rect.bottom > window.innerHeight - margin) {
      top -= rect.bottom - (window.innerHeight - margin);
      card.style.top = `${Math.max(margin, top)}px`;
      card.style.bottom = "auto";
    }

    if (rect.top < margin) {
      card.style.top = `${margin}px`;
      card.style.bottom = "auto";
    }
    const stagger = index * 14;
if (card.style.top) {
  const currentTop = parseFloat(card.style.top);
  if (!Number.isNaN(currentTop)) {
    card.style.top = `${currentTop + stagger}px`;
  }
}
  });
}

function makeCalloutNode(callout) {
  const wrap = document.createElement("div");
  wrap.className = "callout";
  if (callout.accent) wrap.style.setProperty("--accent", callout.accent);

wrap.innerHTML = `
  <div class="calloutDot"></div>
  <div class="calloutLine"></div>
  <div class="calloutCard ${callout.mode === "toggle" ? "is-toggle" : "is-openable"}">
    <div class="calloutHead">
      <div class="calloutBadge">${callout.tag || "•"}</div>
      <div class="calloutTitle">${callout.title || "Info"}</div>
    </div>
    <div class="calloutText">${callout.short || callout.text || ""}</div>
    ${(callout.imgSrc || callout.gallery || callout.text || callout.mode === "toggle")
      ? `<img class="calloutTapIcon" src="img/tap.png" alt="" />`
      : ``}
  </div>
`;

const card = wrap.querySelector(".calloutCard");
if (card) {
  card.addEventListener("click", (e) => {
    e.stopPropagation();

    if (callout.mode === "toggle") {
      const textEl = wrap.querySelector(".calloutText");
      const showingQ = textEl.textContent.trim() === (callout.short || callout.q || "").trim();

      textEl.textContent = showingQ
        ? (callout.a || callout.text || "")
        : (callout.short || callout.q || callout.text || "");

      card.classList.toggle("is-flipped", showingQ);
      return;
    }

    openModal(callout);
  });
}

  calloutsLayer.appendChild(wrap);

  requestAnimationFrame(() => {
    wrap.classList.add("is-visible");
  });

  return wrap;
}

function layoutActiveCallouts() {
  if (!activeAnchorId || !running) return;

  const anchorEl = document.getElementById(activeAnchorId);
  if (!anchorEl) return;

  currentCalloutNodes.forEach((item, index) => {
    const screenPos = placeDotProjected(item.dotEl, anchorEl, item.data.pos);

    if (!screenPos) {
      item.el.style.display = "none";
      return;
    }

    item.el.style.display = "block";
    item.el.style.left = `${screenPos.x}px`;
    item.el.style.top = `${screenPos.y}px`;

    applyCardPosition(item.el, item.data, index);
  });
}

function buildUIFor(targetId) {
  const target = TARGETS[targetId];
  if (!target) return;

  activeAnchorId = targetId;
  renderedTargetId = targetId;
  lastVisibleTargetId = targetId;

  hintEl.textContent = target.hint || "Namier kameru na bankovku…";
  bottomHintEl.textContent = target.bottomHint || "Tip: drž bankovku rovno a v dobrom svetle";

  clearCallouts();

  currentCalloutNodes = (target.callouts || []).map((callout) => ({
    data: callout,
    el: makeCalloutNode(callout),
    dotEl: null
  }));

  currentCalloutNodes.forEach(item => {
    item.dotEl = item.el.querySelector(".calloutDot");
  });

  showARState();
  requestAnimationFrame(layoutActiveCallouts);
}

function closeModal() {
  modalOpen = false;
  document.body.classList.remove("modal-open");
  modalMedia.innerHTML = "";
  modalText.textContent = "";
  modalTitle.textContent = "";
}

function buildModalShell(callout) {
  modalTitle.textContent = callout.imgTitle || callout.title || "Detail";
  modalMedia.innerHTML = "";
  modalText.textContent = "";
}

function renderImageModal(callout) {
  buildModalShell(callout);

  const img = document.createElement("img");
  img.alt = callout.imgTitle || callout.title || "Ilustrácia";

  img.onerror = () => {
    modalMedia.innerHTML = `
      <div style="padding:14px;border:1px solid rgba(255,255,255,.14);border-radius:16px;background:rgba(255,255,255,.04);font-size:14px;line-height:1.4;">
        Obrázok sa nepodarilo načítať: <strong>${callout.imgSrc}</strong>
      </div>
    `;
  };

  img.src = `${callout.imgSrc}?v=${Date.now()}`;
  modalMedia.appendChild(img);

  modalText.textContent = callout.imgText || callout.text || "";
}

function renderTextModal(callout) {
  buildModalShell(callout);
  modalText.textContent = callout.text || "";
}

function renderSlider(callout) {
  buildModalShell(callout);

  const gallery = callout.gallery || [];
  const sliderEl = document.createElement("div");
  sliderEl.className = "slider";

  const stage = document.createElement("div");
  stage.className = "sliderStage";

  const track = document.createElement("div");
  track.className = "sliderTrack";

  gallery.forEach(item => {
    const slide = document.createElement("div");
    slide.className = "slide";

    const img = document.createElement("img");
    img.src = item.src;
    img.alt = callout.title || "";

    slide.appendChild(img);
    track.appendChild(slide);
  });

  stage.appendChild(track);
  sliderEl.appendChild(stage);

  const nav = document.createElement("div");
  nav.className = "sliderNav";

  const prevBtn = document.createElement("button");
  prevBtn.className = "sliderBtn";
  prevBtn.type = "button";
  prevBtn.textContent = "← Predchádzajúci";

  const dotsWrap = document.createElement("div");
  dotsWrap.className = "sliderDots";

  const dotBtns = gallery.map((_, i) => {
    const d = document.createElement("button");
    d.type = "button";
    d.dataset.slide = i;
    if (i === 0) d.classList.add("active");
    return d;
  });
  dotBtns.forEach(d => dotsWrap.appendChild(d));

  const nextBtn = document.createElement("button");
  nextBtn.className = "sliderBtn";
  nextBtn.type = "button";
  nextBtn.textContent = "Ďalší →";

  nav.appendChild(prevBtn);
  nav.appendChild(dotsWrap);
  nav.appendChild(nextBtn);
  sliderEl.appendChild(nav);
  modalMedia.appendChild(sliderEl);

  let current = 0;

  function goTo(idx) {
    current = (idx + gallery.length) % gallery.length;
    track.style.transform = `translateX(-${current * 100}%)`;
    modalText.textContent = gallery[current]?.text || "";
    dotBtns.forEach((d, i) => d.classList.toggle("active", i === current));
  }

  prevBtn.addEventListener("click", () => goTo(current - 1));
  nextBtn.addEventListener("click", () => goTo(current + 1));
  dotBtns.forEach((d, i) => d.addEventListener("click", () => goTo(i)));

  goTo(0);
}

function openModal(callout) {
  modalOpen = true;
  document.body.classList.add("modal-open");

  if (navigator.vibrate) navigator.vibrate(20);

  if (callout.gallery?.length) {
    renderSlider(callout);
  } else if (callout.imgSrc) {
    renderImageModal(callout);
  } else {
    renderTextModal(callout);
  }
}

modalClose.addEventListener("click", closeModal);
modalOverlay.addEventListener("click", closeModal);
modal.addEventListener("click", (e) => {
  if (e.target === modal) closeModal();
});

anchors.forEach(anchorEl => {
  anchorEl.addEventListener("targetFound", () => {
    buildUIFor(anchorEl.id);
  });

  anchorEl.addEventListener("targetLost", () => {
    if (activeAnchorId !== anchorEl.id) return;
    activeAnchorId = null;
    renderedTargetId = null;
    showScanState();
  });
});

sceneEl.addEventListener("arReady", () => {
  ensureMindarVideo(24);

  setTimeout(() => {
    styleMindarVideo();
    if (sceneEl.renderer) {
      sceneEl.renderer.setSize(window.innerWidth, window.innerHeight);
    }
  }, 300);
});

sceneEl.addEventListener("arError", (e) => {
  console.warn("MindAR error", e);
});

window.addEventListener("resize", () => {
  styleMindarVideo();
  if (sceneEl?.renderer) {
    sceneEl.renderer.setSize(window.innerWidth, window.innerHeight);
  }
  if (activeAnchorId) {
    requestAnimationFrame(layoutActiveCallouts);
  }
});

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    setTimeout(() => {
      styleMindarVideo();
      if (sceneEl?.renderer) {
        sceneEl.renderer.setSize(window.innerWidth, window.innerHeight);
      }
      if (activeAnchorId) {
        requestAnimationFrame(layoutActiveCallouts);
      }
    }, 200);
  }
});

function tick() {
  if (running && activeAnchorId) {
    layoutActiveCallouts();
  }
  requestAnimationFrame(tick);
}
tick();
</script>

const SMOOTH = 0.35;
const dotState = new WeakMap();

let activeAnchorId = null;
let renderedTargetId = null;
let running = false;
let modalOpen = false;
let currentCalloutNodes = [];
let lastVisibleTargetId = null;

const hintEl = document.getElementById("hint");
const bottomHintEl = document.getElementById("bottomHint");
const scanEl = document.getElementById("scan");
const calloutsLayer = document.getElementById("calloutsLayer");
const modal = document.getElementById("modal");
const modalOverlay = document.getElementById("modalOverlay");
const modalCard = document.getElementById("modalCard");
const modalTitle = document.getElementById("modalTitle");
const modalMedia = document.getElementById("modalMedia");
const modalText = document.getElementById("modalText");
const modalClose = document.getElementById("modalClose");
const sceneEl = document.querySelector("a-scene");
if (!sceneEl) {
  console.error("a-scene sa nenašla v HTML");
}
const anchors = ["a0", "a1", "a2", "a3", "a4", "a5"].map(id => document.getElementById(id));

(function patchGetUserMediaForFirefox() {
  const isFF = navigator.userAgent.toLowerCase().includes("firefox");
  if (!isFF || !navigator.mediaDevices?.getUserMedia) return;

  const orig = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);

  navigator.mediaDevices.getUserMedia = async function (constraints) {
    let c = constraints;

    if (c?.video && typeof c.video === "object") {
      const v = { ...c.video };

      if (v.facingMode && typeof v.facingMode === "object" && v.facingMode.exact) {
        v.facingMode = { ideal: v.facingMode.exact };
      }

      delete v.width;
      delete v.height;
      delete v.aspectRatio;

      c = { ...c, video: v };
    }

    try {
      return await orig(c);
    } catch (err) {
      console.warn("Firefox primary gUM failed, retrying relaxed constraints", err);
      return orig({
        audio: false,
        video: { facingMode: { ideal: "environment" } }
      });
    }
  };
})();

function styleMindarVideo() {
  const videos = [...document.querySelectorAll("video")];
  const v = videos.find(el =>
    el.autoplay ||
    el.getAttribute("autoplay") !== null ||
    el.playsInline ||
    el.getAttribute("playsinline") !== null
  );

  if (!v) return false;

  v.setAttribute("autoplay", "");
  v.setAttribute("muted", "");
  v.setAttribute("playsinline", "");
  v.muted = true;
  v.playsInline = true;
  v.autoplay = true;

  Object.assign(v.style, {
    position: "fixed",
    inset: "0",
    width: "100%",
    height: "100%",
    objectFit: "cover",
    objectPosition: "center center",
    zIndex: "0",
    display: "block",
    visibility: "visible",
    opacity: "1",
    background: "black"
  });

  const p = v.play && v.play();
  if (p && typeof p.catch === "function") {
    p.catch(err => console.warn("video.play() failed", err));
  }

  return true;
}

function ensureMindarVideo(retries = 24) {
  let n = 0;
  const timer = setInterval(() => {
    n++;
    const ok = styleMindarVideo();
    if (ok || n >= retries) clearInterval(timer);
  }, 250);
}

function isLandscapeLike() {
  return window.innerWidth > window.innerHeight;
}

function clearCallouts() {
  currentCalloutNodes = [];
  calloutsLayer.innerHTML = "";
}

function showScanState() {
  running = false;
  scanEl.style.display = "flex";
  clearCallouts();

  bottomHintEl.textContent = lastVisibleTargetId
    ? `Bankovka sa stratila z dohľadu. ${TARGETS[lastVisibleTargetId]?.bottomHint || ""}`
    : "Tip: drž bankovku rovno a v dobrom svetle";
}

function showARState() {
  scanEl.style.display = "none";
  running = true;
}

function placeDotProjected(dotEl, anchorEl, local) {
  const cam = sceneEl?.camera;
  if (!cam || !anchorEl?.object3D) return null;

  anchorEl.object3D.updateMatrixWorld(true);

  const v = new THREE.Vector3(local.x, local.y, local.z ?? 0.01);
  v.applyMatrix4(anchorEl.object3D.matrixWorld);
  v.project(cam);

  if (v.z < -1 || v.z > 1) {
    dotEl.style.display = "none";
    return null;
  }

  const tx = (v.x * 0.5 + 0.5) * window.innerWidth;
  const ty = (-v.y * 0.5 + 0.5) * window.innerHeight;

  let s = dotState.get(dotEl);
  if (!s) {
    s = { x: tx, y: ty };
    dotState.set(dotEl, s);
  }

  s.x += (tx - s.x) * SMOOTH;
  s.y += (ty - s.y) * SMOOTH;

  dotEl.style.display = "block";
  dotEl.style.left = "0px";
  dotEl.style.top = "0px";

  return { x: s.x, y: s.y };
}

function applyCardPosition(node, callout, index = 0) {
  const card = node.querySelector(".calloutCard");
  if (!card) return;

  const pos = isLandscapeLike() && callout.cardPosLandscape
    ? callout.cardPosLandscape
    : callout.cardPos;

  if (!pos) return;

  card.style.left = "";
  card.style.right = "";
  card.style.top = "";
  card.style.bottom = "";
  card.style.transform = "";
  card.style.width = "";
  card.style.position = "fixed";

  if (pos.top != null) card.style.top = pos.top;
  if (pos.left != null) card.style.left = pos.left;
  if (pos.right != null) card.style.right = pos.right;
  if (pos.bottom != null) card.style.bottom = pos.bottom;

  requestAnimationFrame(() => {
    const rect = card.getBoundingClientRect();
    const margin = 12;

    let left = rect.left;
    let top = rect.top;

    if (rect.right > window.innerWidth - margin) {
      left -= rect.right - (window.innerWidth - margin);
      card.style.left = `${Math.max(margin, left)}px`;
      card.style.right = "auto";
    }

    if (rect.left < margin) {
      card.style.left = `${margin}px`;
      card.style.right = "auto";
    }

    if (rect.bottom > window.innerHeight - margin) {
      top -= rect.bottom - (window.innerHeight - margin);
      card.style.top = `${Math.max(margin, top)}px`;
      card.style.bottom = "auto";
    }

    if (rect.top < margin) {
      card.style.top = `${margin}px`;
      card.style.bottom = "auto";
    }
    const stagger = index * 14;
if (card.style.top) {
  const currentTop = parseFloat(card.style.top);
  if (!Number.isNaN(currentTop)) {
    card.style.top = `${currentTop + stagger}px`;
  }
}
  });
}

function makeCalloutNode(callout) {
  const wrap = document.createElement("div");
  wrap.className = "callout";
  if (callout.accent) wrap.style.setProperty("--accent", callout.accent);

wrap.innerHTML = `
  <div class="calloutDot"></div>
  <div class="calloutLine"></div>
  <div class="calloutCard ${callout.mode === "toggle" ? "is-toggle" : "is-openable"}">
    <div class="calloutHead">
      <div class="calloutBadge">${callout.tag || "•"}</div>
      <div class="calloutTitle">${callout.title || "Info"}</div>
    </div>
    <div class="calloutText">${callout.short || callout.text || ""}</div>
    ${(callout.imgSrc || callout.gallery || callout.text || callout.mode === "toggle")
      ? `<img class="calloutTapIcon" src="img/tap.png" alt="" />`
      : ``}
  </div>
`;

const card = wrap.querySelector(".calloutCard");
if (card) {
  card.addEventListener("click", (e) => {
    e.stopPropagation();

    if (callout.mode === "toggle") {
      const textEl = wrap.querySelector(".calloutText");
      const showingQ = textEl.textContent.trim() === (callout.short || callout.q || "").trim();

      textEl.textContent = showingQ
        ? (callout.a || callout.text || "")
        : (callout.short || callout.q || callout.text || "");

      card.classList.toggle("is-flipped", showingQ);
      return;
    }

    openModal(callout);
  });
}

  calloutsLayer.appendChild(wrap);

  requestAnimationFrame(() => {
    wrap.classList.add("is-visible");
  });

  return wrap;
}

function layoutActiveCallouts() {
  if (!activeAnchorId || !running) return;

  const anchorEl = document.getElementById(activeAnchorId);
  if (!anchorEl) return;

  currentCalloutNodes.forEach((item, index) => {
    const screenPos = placeDotProjected(item.dotEl, anchorEl, item.data.pos);

    if (!screenPos) {
      item.el.style.display = "none";
      return;
    }

    item.el.style.display = "block";
    item.el.style.left = `${screenPos.x}px`;
    item.el.style.top = `${screenPos.y}px`;

    applyCardPosition(item.el, item.data, index);
  });
}

function buildUIFor(targetId) {
  const target = TARGETS[targetId];
  if (!target) return;

  activeAnchorId = targetId;
  renderedTargetId = targetId;
  lastVisibleTargetId = targetId;

  hintEl.textContent = target.hint || "Namier kameru na bankovku…";
  bottomHintEl.textContent = target.bottomHint || "Tip: drž bankovku rovno a v dobrom svetle";

  clearCallouts();

  currentCalloutNodes = (target.callouts || []).map((callout) => ({
    data: callout,
    el: makeCalloutNode(callout),
    dotEl: null
  }));

  currentCalloutNodes.forEach(item => {
    item.dotEl = item.el.querySelector(".calloutDot");
  });

  showARState();
  requestAnimationFrame(layoutActiveCallouts);
}

function closeModal() {
  modalOpen = false;
  document.body.classList.remove("modal-open");
  modalMedia.innerHTML = "";
  modalText.textContent = "";
  modalTitle.textContent = "";
}

function buildModalShell(callout) {
  modalTitle.textContent = callout.imgTitle || callout.title || "Detail";
  modalMedia.innerHTML = "";
  modalText.textContent = "";
}

function renderImageModal(callout) {
  buildModalShell(callout);

  const img = document.createElement("img");
  img.alt = callout.imgTitle || callout.title || "Ilustrácia";

  img.onerror = () => {
    modalMedia.innerHTML = `
      <div style="padding:14px;border:1px solid rgba(255,255,255,.14);border-radius:16px;background:rgba(255,255,255,.04);font-size:14px;line-height:1.4;">
        Obrázok sa nepodarilo načítať: <strong>${callout.imgSrc}</strong>
      </div>
    `;
  };

  img.src = `${callout.imgSrc}?v=${Date.now()}`;
  modalMedia.appendChild(img);

  modalText.textContent = callout.imgText || callout.text || "";
}

function renderTextModal(callout) {
  buildModalShell(callout);
  modalText.textContent = callout.text || "";
}

function renderSlider(callout) {
  buildModalShell(callout);

  const gallery = callout.gallery || [];
  const sliderEl = document.createElement("div");
  sliderEl.className = "slider";

  const stage = document.createElement("div");
  stage.className = "sliderStage";

  const track = document.createElement("div");
  track.className = "sliderTrack";

  gallery.forEach(item => {
    const slide = document.createElement("div");
    slide.className = "slide";

    const img = document.createElement("img");
    img.src = item.src;
    img.alt = callout.title || "";

    slide.appendChild(img);
    track.appendChild(slide);
  });

  stage.appendChild(track);
  sliderEl.appendChild(stage);

  const nav = document.createElement("div");
  nav.className = "sliderNav";

  const prevBtn = document.createElement("button");
  prevBtn.className = "sliderBtn";
  prevBtn.type = "button";
  prevBtn.textContent = "← Predchádzajúci";

  const dotsWrap = document.createElement("div");
  dotsWrap.className = "sliderDots";

  const dotBtns = gallery.map((_, i) => {
    const d = document.createElement("button");
    d.type = "button";
    d.dataset.slide = i;
    if (i === 0) d.classList.add("active");
    return d;
  });
  dotBtns.forEach(d => dotsWrap.appendChild(d));

  const nextBtn = document.createElement("button");
  nextBtn.className = "sliderBtn";
  nextBtn.type = "button";
  nextBtn.textContent = "Ďalší →";

  nav.appendChild(prevBtn);
  nav.appendChild(dotsWrap);
  nav.appendChild(nextBtn);
  sliderEl.appendChild(nav);
  modalMedia.appendChild(sliderEl);

  let current = 0;

  function goTo(idx) {
    current = (idx + gallery.length) % gallery.length;
    track.style.transform = `translateX(-${current * 100}%)`;
    modalText.textContent = gallery[current]?.text || "";
    dotBtns.forEach((d, i) => d.classList.toggle("active", i === current));
  }

  prevBtn.addEventListener("click", () => goTo(current - 1));
  nextBtn.addEventListener("click", () => goTo(current + 1));
  dotBtns.forEach((d, i) => d.addEventListener("click", () => goTo(i)));

  goTo(0);
}

function openModal(callout) {
  modalOpen = true;
  document.body.classList.add("modal-open");

  if (navigator.vibrate) navigator.vibrate(20);

  if (callout.gallery?.length) {
    renderSlider(callout);
  } else if (callout.imgSrc) {
    renderImageModal(callout);
  } else {
    renderTextModal(callout);
  }
}

modalClose.addEventListener("click", closeModal);
modalOverlay.addEventListener("click", closeModal);
modal.addEventListener("click", (e) => {
  if (e.target === modal) closeModal();
});

anchors.forEach(anchorEl => {
  anchorEl.addEventListener("targetFound", () => {
    buildUIFor(anchorEl.id);
  });

  anchorEl.addEventListener("targetLost", () => {
    if (activeAnchorId !== anchorEl.id) return;
    activeAnchorId = null;
    renderedTargetId = null;
    showScanState();
  });
});

sceneEl.addEventListener("arReady", () => {
  ensureMindarVideo(24);

  setTimeout(() => {
    styleMindarVideo();
    if (sceneEl.renderer) {
      sceneEl.renderer.setSize(window.innerWidth, window.innerHeight);
    }
  }, 300);
});

sceneEl.addEventListener("arError", (e) => {
  console.warn("MindAR error", e);
});

window.addEventListener("resize", () => {
  styleMindarVideo();
  if (sceneEl?.renderer) {
    sceneEl.renderer.setSize(window.innerWidth, window.innerHeight);
  }
  if (activeAnchorId) {
    requestAnimationFrame(layoutActiveCallouts);
  }
});

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    setTimeout(() => {
      styleMindarVideo();
      if (sceneEl?.renderer) {
        sceneEl.renderer.setSize(window.innerWidth, window.innerHeight);
      }
      if (activeAnchorId) {
        requestAnimationFrame(layoutActiveCallouts);
      }
    }, 200);
  }
});

function tick() {
  if (running && activeAnchorId) {
    layoutActiveCallouts();
  }
  requestAnimationFrame(tick);
}
tick();
</script>
