<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>AR Bankovky – callouty</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
    }
    body{ min-height:100vh; height:100dvh; }

    /* MindAR video */
    video{
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      object-position: center center !important;
      z-index: 0 !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      background: black !important;
    }
    .dot{ color: #fff; }              /* default */
    .dot.isDot{ background: currentColor; }

    .dot svg{
     fill: currentColor;
      stroke: currentColor;
}


    a-scene{
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1 !important;
    }

    canvas.a-canvas{
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1 !important;
      background: transparent !important;
      pointer-events: none !important;
    }

    .mindar-ui-overlay{
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: -1 !important;
      background: transparent !important;
      pointer-events: none !important;
    }

    /* Hint hore */
    .hint{
      position: fixed;
      left:0; right:0;
      top: 0;
      padding-top: calc(10px + env(safe-area-inset-top));
      padding-bottom: 10px;
      padding-left: max(12px, env(safe-area-inset-left));
      padding-right: max(12px, env(safe-area-inset-right));
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:#fff;
      background: rgba(0,0,0,.55);
      z-index: 50;
      font-size: 14px;
      display:flex;
      justify-content:center;
      text-align:center;
      pointer-events:none;
    }

    /* Scan overlay */
    #scan{
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      gap: 14px;
    }
    .scanBox{
      width: min(72vw, 340px);
      aspect-ratio: 4/2.3;
      position: relative;
      border-radius: 18px;
      background: rgba(0,0,0,.10);
      backdrop-filter: blur(2px);
      box-shadow: 0 10px 40px rgba(0,0,0,.25);
      pointer-events: auto;
      overflow: hidden;
    }
    .scanLine{
      position:absolute;
      left: 10px; right: 10px;
      height: 2px;
      top: 12px;
      background: rgba(255,255,255,.85);
      box-shadow: 0 0 18px rgba(255,255,255,.65);
      animation: scanMove 1.6s ease-in-out infinite;
    }
    @keyframes scanMove{
      0%   { transform: translateY(0); opacity: .35; }
      50%  { transform: translateY(calc(100% - 28px)); opacity: 1; }
      100% { transform: translateY(0); opacity: .35; }
    }
    .scanCorners{
      position:absolute;
      inset: 0;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.22);
    }
    .scanText{
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color: rgba(255,255,255,.9);
      font-size: 14px;
      background: rgba(0,0,0,.35);
      padding: 8px 12px;
      border-radius: 999px;
    }

    /* UI karty */
    #ui{
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      pointer-events: auto;
      padding-top: calc(48px + env(safe-area-inset-top));
    }
    .card{
      position:absolute;
      border: 1px solid rgba(255,255,255,.18);
      border-left: 6px solid currentColor;
      right: 12px;
      max-width: min(340px, 88vw);
      padding: 12px 14px;
      border-radius: 16px;
      color: #fff;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      font-size: 16px;
      line-height: 1.25;
      background: rgba(0,0,0,.32);
      border: 1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(8px);
      text-shadow: 0 2px 12px rgba(0,0,0,.65);
      user-select: none;
      cursor: pointer;
    }
    .card .title{
      font-weight: 800;
      margin-bottom: 6px;
      font-size: 17px;
    }
    .card .small{
      margin-top: 8px;
      font-size: 13px;
      opacity: .9;
      display: inline-block;
      border: 1px solid rgba(255,255,255,.22);
      padding: 6px 10px;
      border-radius: 999px;
    }
    .card .badge{
  display:inline-grid;
  place-items:center;
  width: 26px;
  height: 26px;
  border-radius: 999px;
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.18);
  margin-right: 8px;
  font-weight: 900;
  color: currentColor;            /* ACCENT */
  flex: 0 0 auto;
}
.card .headRow{
  display:flex;
  align-items:center;
  gap: 8px;
  margin-bottom: 6px;
}

    /* DOM dots + icons (default biele) */
    #dots{
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none; /* zatiaľ nech klikáš cez karty; keď chceš klik na bodky, zmeň na auto */
      display: none;
    }
.dot{
  position: absolute;
  transform: translate(-50%, -50%);
  display: none;
  width: 24px;
  height: 24px;
  pointer-events: none;
}

/* iba pre klasickú bodku */
.dot.isDot{
  width: 16px;
  height: 16px;
  border-radius: 999px;
  background: #fff;
  box-shadow: 0 0 0 6px rgba(255,255,255,.18), 0 8px 24px rgba(0,0,0,.35);
}

/* pre ikonky */
.dot.isIcon svg{
  width: 24px;
  height: 24px;
  fill: #fff;
  stroke: #fff;
  filter: drop-shadow(0 0 10px rgba(255,255,255,.35));
}

    .iconDot{
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
    }
    .dot svg{
      width: 18px;
      height: 18px;
      fill: #fff;       /* biele */
      stroke: #fff;     /* biele */
    }

    /* Modal (obrázky) */
    #modal{
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(6px);
      pointer-events: auto;
    }
    #modalCard{
      width: min(92vw, 560px);
      max-height: min(86vh, 720px);
      overflow: auto;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.45);
      padding: 14px;
      color: #fff;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      box-shadow: 0 20px 70px rgba(0,0,0,.45);
    }
    #modalHead{
      display:flex;
      align-items:flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    #modalTitle{
      font-weight: 900;
      font-size: 18px;
      line-height: 1.15;
    }
    #modalClose{
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.18);
      color: #fff;
      border-radius: 12px;
      padding: 6px 10px;
      cursor: pointer;
      user-select: none;
      flex: 0 0 auto;
    }
    #modalImg{
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.25);
      display: block;
    }
    #modalText{
      margin-top: 10px;
      font-size: 15px;
      line-height: 1.35;
      opacity: .95;
    }
    /* default farba accentu (keď nie je zadaná) */
.dot, .card { --accent: #ffffff; }

/* DOT */
.dot.isDot{
  background: var(--accent);
  box-shadow: 0 0 0 6px rgba(255,255,255,.18), 0 8px 24px rgba(0,0,0,.35);
}
.dot.isIcon svg{
  width: 24px;
  height: 24px;
  fill: var(--accent);
  stroke: var(--accent);
  filter: drop-shadow(0 0 10px rgba(255,255,255,.35));
}
.dot svg{
  fill: var(--accent);
  stroke: var(--accent);
}

/* CARD – text nech je biely, accent len na bordery/badge */
.card{
  color: #fff; /* <- toto je pointa */
  border-left: 6px solid var(--accent);
}
.card .badge{
  color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 50%, rgba(255,255,255,.18));
}

  </style>
</head>

<body>
  <div id="hint" class="hint">Namier kameru na bankovku…</div>

  <div id="scan">
    <div class="scanBox">
      <div class="scanLine"></div>
      <div class="scanCorners"></div>
    </div>
    <div class="scanText">Hľadám bankovku…</div>
  </div>

  <!-- UI karty (dynamicky generované) -->
  <div id="ui"></div>

  <!-- DOM bodky (dynamicky generované) -->
  <div id="dots"></div>

  <!-- Modal pre obrázky -->
  <div id="modal">
    <div id="modalCard">
      <div id="modalHead">
        <div id="modalTitle">Nadpis</div>
        <div id="modalClose">Zavrieť</div>
      </div>
      <img id="modalImg" alt="Ilustrácia" src="" />
      <div id="modalText"></div>
    </div>
  </div>

  <!-- A-Frame + MindAR -->
  <a-scene
    mindar-image="imageTargetSrc: targets_all.mind; autoStart: true; filterMinCF: 0.001; filterBeta: 0.001;"
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    renderer="alpha:true; antialias:true"
    background="transparent: true"
    embedded
  >
    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <!-- 6 anchorov (0..5) -->
    <a-entity mindar-image-target="targetIndex: 0" id="a0"></a-entity>
    <a-entity mindar-image-target="targetIndex: 1" id="a1"></a-entity>
    <a-entity mindar-image-target="targetIndex: 2" id="a2"></a-entity>
    <a-entity mindar-image-target="targetIndex: 3" id="a3"></a-entity>
    <a-entity mindar-image-target="targetIndex: 4" id="a4"></a-entity>
    <a-entity mindar-image-target="targetIndex: 5" id="a5"></a-entity>
  </a-scene>

<script>

  /* =========================
     Projekcia 3D bodu -> 2D pixely
     ========================= */
  function placeDotProjected(dotEl, anchorEl, local){
    const sceneEl = anchorEl.sceneEl;
    const cam = sceneEl && sceneEl.camera;
    if (!cam || !anchorEl.object3D) return;

    anchorEl.object3D.updateMatrixWorld(true);

    const v = new THREE.Vector3(local.x, local.y, local.z ?? 0.01);
    v.applyMatrix4(anchorEl.object3D.matrixWorld);
    v.project(cam);

    if (v.z < -1 || v.z > 1) {
      dotEl.style.display = "none";
      return;
    }
    dotEl.style.display = "block";

    const x = (v.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-v.y * 0.5 + 0.5) * window.innerHeight;

    dotEl.style.left = `${x}px`;
    dotEl.style.top  = `${y}px`;
  }

  function styleMindarVideoOnce() {
    const vids = [...document.querySelectorAll('video')];
    const v = vids.find(x =>
      x.autoplay || x.getAttribute('autoplay') !== null ||
      x.playsInline || x.getAttribute('playsinline') !== null
    );
    if (!v) return false;

    Object.assign(v.style, {
      position: "fixed",
      inset: "0",
      width: "100%",
      height: "100%",
      objectFit: "cover",
      objectPosition: "center center",
      zIndex: "0",
      display: "block",
      visibility: "visible",
      opacity: "1",
      background: "black"
    });

    setTimeout(() => window.dispatchEvent(new Event("resize")), 50);
    return true;
  }

  document.addEventListener("DOMContentLoaded", () => {
    const hintEl = document.getElementById("hint");
    const scanEl = document.getElementById("scan");
    const uiEl   = document.getElementById("ui");
    const dotsEl = document.getElementById("dots");

    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalImg = document.getElementById("modalImg");
    const modalText = document.getElementById("modalText");
    const modalClose = document.getElementById("modalClose");

    const anchors = ["a0","a1","a2","a3","a4","a5"].map(id => document.getElementById(id));

    let activeAnchorId = null;
    let activeCallouts = [];
    let dotNodes = [];   // DOM elements for dots
    let cardNodes = [];  // DOM elements for cards
    let running = false;

    function closeModal(){
      modal.style.display = "none";
      modalImg.src = "";
    }

    modalClose.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    function resetUI(){
      uiEl.style.display = "none";
      dotsEl.style.display = "none";
      scanEl.style.display = "flex";
      running = false;
      activeAnchorId = null;
      activeCallouts = [];

      // clear dynamic nodes
      uiEl.innerHTML = "";
      dotsEl.innerHTML = "";
      dotNodes = [];
      cardNodes = [];

      closeModal();
    }
function openModalFor(callout){
  if (!callout.imgSrc) return;

  modalTitle.textContent = callout.imgTitle || callout.title || "Obrázok";
  modalText.textContent = callout.text || "";

  // ukáž modal hneď (aj keby sa obrázok ešte načítaval)
  modal.style.display = "flex";

  // debug-friendly: ak obrázok neexistuje, uvidíš to
  modalImg.onerror = () => {
    modalText.textContent = `Obrázok sa nenašiel: ${callout.imgSrc}`;
    modalImg.removeAttribute("src");
  };

  modalImg.src = callout.imgSrc;
}
    function buildUIFor(targetId){
  const t = TARGETS[targetId];
  if (!t) return;

  hintEl.textContent = t.hint || "Namier kameru na bankovku…";

  const topStart = 42;  // % od vrchu
  const step = 18;      // % odstup
  const right = 12;     // px

  uiEl.innerHTML = "";
  dotsEl.innerHTML = "";
  dotNodes = [];
  cardNodes = [];

  activeCallouts = t.callouts || [];

  activeCallouts.forEach((c, i) => {
    const isToggle = c.mode === "toggle";

    // CARD
    const card = document.createElement("div");
    card.className = "card";
if (c.accent) {
  card.style.setProperty("--accent", c.accent);
}

    if (c.cardPos) {
  if (c.cardPos.top) card.style.top = c.cardPos.top;
  if (c.cardPos.right) card.style.right = c.cardPos.right;
  if (c.cardPos.left) card.style.left = c.cardPos.left;
  if (c.cardPos.bottom) card.style.bottom = c.cardPos.bottom;
} else {
  // fallback – pôvodné automatické skladanie
  card.style.top = `${topStart + i*step}%`;
  card.style.right = `${right}px`;
}

    card.innerHTML = `
  <div class="headRow">
    <div class="badge">${c.tag || (i+1)}</div>
    <div class="title">${c.title || "Info"}</div>
  </div>
  <div class="body">
    ${isToggle ? (c.q || "") : (c.text || "")}
  </div>
  ${
    isToggle
      ? `<div class="small">Klikni pre odpoveď</div>`
      : (c.imgSrc ? `<div class="small">Klikni pre obrázok</div>` : ``)
  }
`;

    card.addEventListener("click", () => {
      // 1) toggle režim (Q <-> A)
      if (isToggle) {
        const body = card.querySelector(".body");
        const pill = card.querySelector(".small");

        const q = (c.q || "").trim();
        const a = (c.a || "").trim();

        const showingQ = body.textContent.trim() === q;
        body.textContent = showingQ ? a : q;

        if (pill) pill.textContent = showingQ ? "Klikni pre otázku" : "Klikni pre odpoveď";
        return;
      }

      // 2) modal režim (ak je imgSrc)
      openModalFor(c);
    });

    uiEl.appendChild(card);
    cardNodes.push(card);

    // DOT
    
    const dot = document.createElement("div");
    dot.className = "dot";
    dot.dataset.calloutId = c.id || `c${i}`;

    const iconKey = c.icon || "dot";
    dot.className = "dot " + (iconKey === "dot" ? "isDot" : "isIcon");

    dot.innerHTML = `<div class="iconDot">${ICONS[iconKey] || ICONS.dot}</div>`;
    if (c.accent) {
  dot.style.setProperty("--accent", c.accent);
}

    dotsEl.appendChild(dot);
    dotNodes.push(dot);

  });

  uiEl.style.display = "block";
  dotsEl.style.display = "block";
  scanEl.style.display = "none";
  running = true;
}


    // targetFound/targetLost pre každý anchor
    anchors.forEach((anchorEl) => {
      const id = anchorEl.id;

      anchorEl.addEventListener("targetFound", () => {
        activeAnchorId = id;
        buildUIFor(id);
      });

      anchorEl.addEventListener("targetLost", () => {
        // resetuj len ak si práve stratil aktívny
        if (activeAnchorId === id) {
          resetUI();
          hintEl.textContent = "Namier kameru na bankovku…";
        }
      });
    });

    // Tick: projekcia bodiek podľa aktívneho anchoru
    function tick(){
      if (running && activeAnchorId){
        const anchorEl = document.getElementById(activeAnchorId);
        const t = TARGETS[activeAnchorId];

        if (anchorEl && t && t.callouts){
          for (let i = 0; i < t.callouts.length; i++){
            const c = t.callouts[i];
            const dot = dotNodes[i];
            if (!dot) continue;
            placeDotProjected(dot, anchorEl, c.pos);
          }
        }
      }
      requestAnimationFrame(tick);
    }
    tick();

    // video fix
    if (!styleMindarVideoOnce()) {
      const mo = new MutationObserver(() => {
        if (styleMindarVideoOnce()) mo.disconnect();
      });
      mo.observe(document.documentElement, { childList: true, subtree: true });
    }

    window.addEventListener("orientationchange", () => setTimeout(() => {
      window.dispatchEvent(new Event("resize"));
    }, 200));

    // default state
    resetUI();
    hintEl.textContent = "Namier kameru na bankovku…";
  });
</script>

</body>
</html>
